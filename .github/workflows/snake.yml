
name: Generate Contribution Snake

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: chaithanya-5416
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish snake files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --single-branch --branch output https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git output-repo || git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git output-repo
          cd output-repo
          git checkout --orphan output-new
          git rm -rf . || true
          cp -r ../dist/* .
          git add .
          git commit -m "Update contribution snake"
          git push --force origin output-new:output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
